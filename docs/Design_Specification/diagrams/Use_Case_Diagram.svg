<text x="95" y="111" text-anchor="start" font-size="29" font-weight="500" fill="#2d516e" >UML Use Case Diagram</text>
<text x="1720" y="90" text-anchor="end" font-size="19" font-weight="400" fill="#688097" >Planned features • Based on the team Software Requirements Specification</text>
