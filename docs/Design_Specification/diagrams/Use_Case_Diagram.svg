<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1560" viewBox="0 0 1800 1560" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Golden Eagle Flight Plan — UML Use Case Diagram</title>
<desc id="svgDesc">Golden Eagle Flight Plan software use cases. Visitor registers. All four registered roles inherit login, event viewing and RSVP, and own-profile access. Student tracks flight-plan and receives updates. Faculty views student profiles and manages events. Student organizations manage events but not student profiles. Administrator approves accounts and manages permissions.</desc>
<style>text {font-family: Arial, Helvetica, sans-serif;} .connector {stroke:#647b90;stroke-width:2.25;fill:none;stroke-linejoin:round;stroke-linecap:round;} .gen {stroke:#9aaabb;stroke-width:1.9;fill:none;stroke-linejoin:round;stroke-linecap:round;} .usecase {fill:#ffffff;stroke:#315a7d;stroke-width:2.1;} .actor {stroke:#1f405d;stroke-width:3.25;fill:none;stroke-linecap:round;stroke-linejoin:round;} .small {fill:#557083;font-size:18px} </style>
<rect width="1800" height="1560" fill="white"/>
