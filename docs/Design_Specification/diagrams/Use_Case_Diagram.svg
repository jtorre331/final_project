<text x="500" y="212" text-anchor="start" font-size="18" font-weight="700" fill="#597895" letter-spacing="1.3">ACCOUNT CREATION</text>
<rect x="476" y="292" width="1222" height="260" rx="12" fill="#ffffff" stroke="none" stroke-width="0" />
<text x="500" y="321" text-anchor="start" font-size="18" font-weight="700" fill="#597895" letter-spacing="1.3">SHARED ACCOUNT ACTIONS</text>
<rect x="476" y="566" width="1222" height="298" rx="12" fill="#f4f8fc" stroke="none" stroke-width="0" />
<text x="500" y="595" text-anchor="start" font-size="18" font-weight="700" fill="#597895" letter-spacing="1.3">STUDENT FEATURES</text>
<rect x="476" y="878" width="1222" height="306" rx="12" fill="#ffffff" stroke="none" stroke-width="0" />
<text x="500" y="907" text-anchor="start" font-size="18" font-weight="700" fill="#597895" letter-spacing="1.3">FACULTY &amp; ORGANIZERS</text>
<text x="1455" y="938" text-anchor="start" font-size="18" font-weight="400" fill="#8190a0" >Faculty only</text>
<text x="1455" y="1103" text-anchor="start" font-size="18" font-weight="400" fill="#8190a0" >Faculty and student organizations</text>
<rect x="476" y="1198" width="1222" height="253" rx="12" fill="#f4f8fc" stroke="none" stroke-width="0" />
<text x="500" y="1227" text-anchor="start" font-size="18" font-weight="700" fill="#597895" letter-spacing="1.3">ADMINISTRATION</text>
<rect x="1370" y="223" width="300" height="46" rx="10" fill="#edf4fa" stroke="#d7e4ef" stroke-width="1" />
<text x="1387" y="244" text-anchor="start" font-size="16" font-weight="400" fill="#526b80" >Student accounts activate directly.</text>
<text x="1387" y="267" text-anchor="start" font-size="16" font-weight="400" fill="#526b80" >Faculty / organizations need approval.</text>
<rect x="1360" y="671" width="300" height="70" rx="10" fill="#edf4fa" stroke="#d7e4ef" stroke-width="1" />
<text x="1377" y="692" text-anchor="start" font-size="16" font-weight="400" fill="#526b80" >Students can track progress across</text>
<text x="1377" y="715" text-anchor="start" font-size="16" font-weight="400" fill="#526b80" >the flight-plan categories.</text>
<rect x="1360" y="1298" width="300" height="80" rx="10" fill="#edf4fa" stroke="#d7e4ef" stroke-width="1" />
<text x="1377" y="1319" text-anchor="start" font-size="16" font-weight="400" fill="#526b80" >Administrators have full access</text>
<text x="1377" y="1342" text-anchor="start" font-size="16" font-weight="400" fill="#526b80" >under the SRS, including these</text>
<text x="1377" y="1365" text-anchor="start" font-size="16" font-weight="400" fill="#526b80" >management actions.</text>
